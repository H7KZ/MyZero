[package]
name = "voice-assistant"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voice-assistant"
path = "src/main.rs"

[dependencies]
# Shared breadboard hardware (LED, OLED feedback)
board-hal = { path = "../../crates/board-hal" }

# Voice pipeline — all offline, all local:
rustpotter = "3"   # wake-word detection (pure Rust, locally trained)
vosk = "0.3"       # speech-to-text (links native libvosk)
cpal = "0.15"      # microphone capture (ALSA on the Pi)
# Piper (TTS) is invoked as an external CLI — no crate dependency.
