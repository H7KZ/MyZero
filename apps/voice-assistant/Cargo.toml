[package]
name = "voice-assistant"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voice-assistant"
path = "src/main.rs"

[dependencies]
# Shared workspace crates
devices = { path = "../../crates/devices" } # LED + OLED feedback
audio = { path = "../../crates/audio" }     # microphone capture (cpal)
net = { path = "../../crates/net" }         # wake-on-lan

# Speech — one Vosk model does both wake-word spotting and command recognition.
vosk = "0.3" # links native libvosk
# Piper (TTS) is invoked as an external CLI — no crate dependency.
