# Extras for cross-compiling to the Pi Zero 2 (aarch64).
#
# voice-assistant needs two native libs in the cross Docker image:
#   - libasound2 (cpal/ALSA) — installed from the Debian repo for the target arch
#   - libvosk    (Vosk STT)  — no Debian package; downloaded from the Vosk release page
# The libvosk.so ends up in /usr/lib/aarch64-linux-gnu/ so the linker finds it.
# The same .so must also be present on the Pi at runtime (e.g. /usr/local/lib/).

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update",
    "apt-get install -y libasound2-dev:$CROSS_DEB_ARCH unzip curl",
    "curl -fsSL https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-aarch64-0.3.45.zip -o /tmp/vosk.zip",
    "unzip -q /tmp/vosk.zip -d /tmp/vosk",
    "cp /tmp/vosk/vosk-linux-aarch64-0.3.45/libvosk.so /usr/lib/aarch64-linux-gnu/libvosk.so",
    "rm -rf /tmp/vosk.zip /tmp/vosk",
]
