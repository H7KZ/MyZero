# /etc/sysctl.d/99-pizero.conf
# Pi Zero 2 WH kernel tuning — generated by pizero2 install.sh
# Safe to re-apply; all values tested on RPi kernel 6.12 aarch64.
#
# Keys that require CONFIG_SCHED_DEBUG or other optional kernel options
# are written separately by install.sh after probing /proc/sys/.

# ── Memory: ZRAM-aware tuning ─────────────────────────────────
# swappiness=100: ZRAM is fast RAM-compressed swap; prefer it over
#   keeping cold pages in uncompressed RAM.
vm.swappiness = 100

# vfs_cache_pressure=200: reclaim dentry/inode caches more eagerly
#   so they compress into ZRAM rather than sitting uncompressed.
vm.vfs_cache_pressure = 200

vm.dirty_background_ratio = 1
vm.dirty_ratio = 50

# page-cluster=0: swap one page at a time (not 8).
#   With ZRAM there's no seek penalty, so prefetching wastes RAM.
vm.page-cluster = 0

vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.oom_kill_allocating_task = 1
vm.min_free_kbytes = 16384
vm.zone_reclaim_mode = 0
vm.compaction_proactiveness = 0

# ── Network: sized for CYW43438 (72 Mbps PHY, 512 MB RAM) ────
net.core.rmem_max = 2097152
net.core.wmem_max = 2097152
net.core.rmem_default = 131072
net.core.wmem_default = 131072
net.ipv4.tcp_rmem = 4096 131072 2097152
net.ipv4.tcp_wmem = 4096 65536 2097152
net.core.somaxconn = 256

# BBR congestion control handles WiFi packet loss better than CUBIC
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

net.ipv4.tcp_max_tw_buckets = 2048
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# ── ARP cache: small home network ────────────────────────────
net.ipv4.neigh.default.gc_thresh1 = 32
net.ipv4.neigh.default.gc_thresh2 = 128
net.ipv4.neigh.default.gc_thresh3 = 256

# ── Network security ──────────────────────────────────────────
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1

# ── Filesystem hardening ──────────────────────────────────────
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# Disable core dumps system-wide
kernel.core_pattern = /dev/null

# Auto-reboot 10 s after kernel panic
kernel.panic = 10
kernel.panic_on_oops = 1
