# /etc/modprobe.d/pizero-brcmfmac.conf
# CYW43438 WiFi driver options for Pi Zero 2 WH
#
# roamoff=1: disable firmware-level roaming.
#   The Pi is stationary — roaming causes spurious disconnections
#   while scanning for "better" APs that don't exist.
#
# We intentionally do NOT set feature_disable flags.
# Disabling the 4-way handshake (0x002000) or SAE offload (0x080000)
# breaks WPA2/WPA3 authentication on many real-world access points.
options brcmfmac roamoff=1
