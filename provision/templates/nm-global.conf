# NetworkManager global config for Pi Zero 2 WH
# Installed to /etc/NetworkManager/conf.d/pizero.conf

[connection]
# wifi.powersave = 2 means DISABLED in NM's enum:
#   1 = NM default  2 = disabled  3 = enabled
# Disabled because CYW43438 (the Pi Zero WiFi chip) drops connections
# intermittently when power saving is active.
wifi.powersave=2

[device]
# Use the real hardware MAC, not a random one.
# Ensures stable DHCP leases and BSSID binding works correctly.
wifi.scan-rand-mac-address=no

[logging]
level=WARN
