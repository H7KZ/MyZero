# dnsmasq DHCP config for Pi Zero 2 WH fallback hotspot
# Template installed to /etc/dnsmasq.d/pizero-hotspot.conf
#
# Variables substituted by install.sh:
#   %%HOTSPOT_IP%%   → HOTSPOT_IP from pizero.conf
#   %%PI_HOSTNAME%%  → PI_HOSTNAME from pizero.conf
#
# At runtime, hotspot-start.sh patches:
#   interface=      → uap0 (virtual AP interface)
#   dhcp-range=     → derived from HOTSPOT_IP subnet
#
# This dnsmasq instance is started by hotspot-start.sh with
# explicit --conf-file, --except-interface, and --no-resolv
# flags. It is NOT the system dnsmasq service.
#
# Port 53 conflict handling:
#   We use bind-dynamic instead of bind-interfaces.
#   bind-dynamic: listen on the uap0 IP only, handles interface
#   appearing/disappearing gracefully. If another process has
#   port 53, dnsmasq will still work for DHCP (port 67/68).
#
#   If you are running Pi-hole or another DNS server, this
#   instance only serves DHCP (port 67) and local .local names
#   to hotspot clients. It does not conflict on port 53
#   because the Pi-hole DNS listener is on a different interface.

# Interface patched to "uap0" at runtime
interface=wlan0
bind-dynamic

# DHCP pool — range and subnet are patched at runtime from HOTSPOT_IP
# e.g. HOTSPOT_IP=10.42.0.1 → 10.42.0.10 – 10.42.0.50
dhcp-range=10.42.0.10,10.42.0.50,255.255.255.0,12h

# Tell clients: the Pi is their gateway and DNS resolver
dhcp-option=option:router,%%HOTSPOT_IP%%
dhcp-option=option:dns-server,%%HOTSPOT_IP%%

# ── DNS for hotspot clients ───────────────────────────────────
# Resolve the Pi's own hostname to its hotspot IP
# Clients can reach the Pi via <hostname>.local or raspberry.local
address=/%%PI_HOSTNAME%%.local/%%HOTSPOT_IP%%
address=/raspberry.local/%%HOTSPOT_IP%%

# Upstream DNS servers (used for all other lookups by hotspot clients)
server=1.1.1.1
server=9.9.9.9
server=8.8.8.8

# Local domain for DHCP hostnames
domain=local
local=/local/

# Do not read /etc/resolv.conf — use only the server= lines above
no-resolv
no-poll

# ── Logging ───────────────────────────────────────────────────
# Log file path is overridden at runtime by hotspot-start.sh
log-queries=extra
log-facility=/run/pizero-dnsmasq.log

# ── DHCP lease persistence ────────────────────────────────────
# Store leases in /tmp (RAM) — not SD card
dhcp-leasefile=/tmp/pizero-dnsmasq.leases
