# NetworkManager keyfile template for pizero2 home WiFi connection.
# This file is a template — install.sh fills in the variables and
# copies it to /etc/NetworkManager/system-connections/pizero-home.nmconnection
#
# Variable substitution done by install.sh (not shell heredoc):
#   %%SSID%%        → WIFI_SSID from pizero.conf
#   %%KEY_MGMT%%    → WPA-PSK (wpa2) or SAE (wpa3)
#   %%PSK%%         → WIFI_PASSWORD from pizero.conf
#   %%UUID%%        → generated once and reused on re-runs

[connection]
id=pizero-home
uuid=%%UUID%%
type=wifi
autoconnect=true
autoconnect-priority=100
autoconnect-retries=0

[wifi]
mode=infrastructure
ssid=%%SSID%%
cloned-mac-address=permanent
hidden=false

[wifi-security]
auth-alg=open
key-mgmt=%%KEY_MGMT%%
psk=%%PSK%%

[ipv4]
method=auto
dhcp-timeout=30
dhcp-send-hostname=true

[ipv6]
method=disabled
addr-gen-mode=default

[proxy]
