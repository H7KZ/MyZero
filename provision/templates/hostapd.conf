# hostapd configuration for Pi Zero 2 WH fallback hotspot
# Template installed to /etc/hostapd/pizero-fallback.conf
#
# Variables substituted by install.sh:
#   %%HOTSPOT_SSID%%     → HOTSPOT_SSID from pizero.conf
#   %%HOTSPOT_PASSWORD%% → HOTSPOT_PASSWORD from pizero.conf
#   %%HOTSPOT_CHANNEL%%  → HOTSPOT_CHANNEL from pizero.conf (default)
#
# At runtime, hotspot-start.sh patches:
#   interface=  → uap0 (virtual AP interface)
#   channel=    → active channel detected from wlan0 (channel sync)
#
# IMPORTANT — NO country_code HERE:
#   country_code must NOT appear in this file. When hostapd sees it,
#   it signals the driver for a COUNTRY_UPDATE which briefly takes
#   the interface DOWN. hostapd tries to set beacons during that
#   window → "Could not connect to kernel driver" → fails.
#   The regulatory domain is set on wlan0 via `iw reg set` BEFORE
#   uap0 is created, with a settle delay. hotspot-start.sh then
#   strips any stray country_code lines with sed before starting.
#
# Hardware notes (CYW43438 / BCM43430):
#   - 2.4 GHz only, 1x1 MIMO, max 72.2 Mbps PHY rate
#   - WPA3/SAE is NOT stable on this firmware — WPA2-PSK only
#   - 40 MHz HT channels degrade AP/STA concurrency — 20 MHz only

# Interface patched to "uap0" at runtime
interface=wlan0
driver=nl80211

ssid=%%HOTSPOT_SSID%%
ignore_broadcast_ssid=0

# 2.4 GHz 802.11b/g/n
hw_mode=g
channel=%%HOTSPOT_CHANNEL%%

# 802.11n + WMM required for n-mode
ieee80211n=1
wmm_enabled=1

# WPA2-PSK / AES-CCMP only — no TKIP, no WPA3
macaddr_acl=0
auth_algs=1
wpa=2
wpa_passphrase=%%HOTSPOT_PASSWORD%%
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Limit clients and idle time
max_num_sta=10
ap_max_inactivity=300
