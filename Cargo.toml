[workspace]
resolver = "2"
members = [
    "crates/devices",
    "crates/audio",
    "crates/net",
    "apps/departure-board",
    "apps/voice-assistant",
]

# Shared dependency versions — apps/crates pull these via `{ workspace = true }`.
[workspace.dependencies]
# GPIO + display
rppal = "0.22.1"
sh1106 = "0.5.0"
embedded-graphics = "0.8.2"
linux-embedded-hal = "0.3.2"

# Audio capture (mic on the USB sound card, via ALSA)
cpal = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.13.2", features = ["json"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Size-optimized release for the Zero 2's flash + RAM.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
